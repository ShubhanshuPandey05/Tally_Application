; Root pytest configuration, and the only reason it exists is `run.py check`.
;
; `check` runs ONE pytest invocation across all three projects at once:
;
;     pytest packages apps/backend apps/connector
;
; pytest then computes a single rootdir -- the common ancestor of those paths,
; which is this directory -- and reads its configuration from there. It does
; NOT merge the [tool.pytest.ini_options] block out of each project's
; pyproject.toml. Without a config file here there is no configuration at all,
; so `asyncio_mode` is unset and every async test in the repository fails with
; "async def functions are not natively supported" -- a message that points at
; a missing plugin when the plugin is installed and correctly configured three
; directories down.
;
; The per-project blocks still apply when a project is tested on its own
; (`pytest apps/backend/tests` finds apps/backend/pyproject.toml and uses it),
; which is exactly why this failure only ever appeared through `check` and
; never when running one suite while working on it.
;
; Keep this in sync with those blocks. `testpaths` is deliberately absent: the
; paths are given on the command line here, and setting it would silently
; narrow a run that names a specific test file.
[pytest]
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning:passlib.*
