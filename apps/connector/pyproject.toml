[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tally-connector"
version = "0.1.0"
description = "Windows connector: the only component that talks to TallyPrime."
requires-python = ">=3.11"
dependencies = [
    "tally-core",
    "websockets>=12.0",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pyinstaller>=6.6",
]

[project.scripts]
tally-connector = "tally_connector.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
