<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Your TallyPrime books on your phone. Read-only.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Prime Analyst">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Prime Analyst</title>
  <link rel="manifest" href="manifest.json">
  <!--
    The tile while the engine downloads, at the size the in-app splash paints
    it, so the first Flutter frame lands on the same picture. White on purpose:
    the app's skin never follows the system and this page cannot read it.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; }
    #splash {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
    }
    #splash img { width: 96px; height: 96px; }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt="Prime Analyst"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
