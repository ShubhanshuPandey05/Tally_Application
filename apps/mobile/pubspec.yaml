name: tallyflow
description: "TallyFlow -- a read-only mobile dashboard for TallyPrime."
publish_to: 'none'

# Must match the APK the site links to and the update manifest names: the
# updater compares this against the manifest, so a pubspec that disagrees with
# the shipped artefact makes every client believe it is permanently out of date.
version: 0.6.0+6

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  # State. Riverpod rather than a service locator: the read path is a tree of
  # async values (session -> company -> dashboard) and AsyncValue models
  # loading/error/stale-data as one type instead of three nullable fields.
  flutter_riverpod: ^2.5.1

  # Navigation. Declarative redirects are what enforce "no screen renders
  # without a session" in one place rather than per-screen guards.
  go_router: ^14.2.7

  # HTTP. Interceptors are the reason: token attachment and the 401 refresh
  # dance belong below the repositories, not inside every call site.
  dio: ^5.7.0

  # Refresh tokens are long-lived credentials for a company's books; they go in
  # the Keychain / EncryptedSharedPreferences, never in plain preferences.
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Money is parsed as decimal, never double. Binary floating point cannot hold
  # 0.1, and this app shows people their bank balance.
  decimal: ^3.0.2

  intl: ^0.19.0
  fl_chart: ^0.69.0

  # The running build's own version, read from the platform rather than from a
  # constant in Dart. A hard-coded version is one more place to forget on
  # release day, and the symptom -- an app convinced it is permanently out of
  # date -- is expensive to diagnose.
  package_info_plus: ^8.0.2

  # Pairing a Tally PC by camera. The alternative it replaces is a shop owner
  # reading a 43-character secret off this screen and typing it into a Windows
  # keyboard across the room, which is where new customers actually get stuck.
  #
  # Wraps the platform's own barcode engines (ML Kit on Android, Vision on iOS)
  # rather than decoding frames in Dart: a scanner that struggles with a code on
  # a dusty monitor under shop lighting is a scanner nobody uses twice.
  mobile_scanner: ^5.2.3

  # Hands the APK download to the browser. Installing a package from our own
  # storage would need REQUEST_INSTALL_PACKAGES and a FileProvider; the browser
  # already owns that flow and shows the prompt users recognise.
  url_launcher: ^6.3.0

  # Sharing a voucher or a statement as a document. `pdf` draws it and
  # `printing` hands it to the platform's own share sheet, which is what a shop
  # owner already uses to put a bill on WhatsApp.
  #
  # Drawn on the phone from data already on screen rather than rendered by the
  # backend: the document must come out of a pocket while standing in front of
  # the customer, and a round trip to a server -- then to a sleeping Windows PC
  # -- is exactly the wait that makes somebody open TallyPrime instead.
  pdf: ^3.11.3
  printing: ^5.14.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # The one place a typeface is part of the brand rather than part of the
  # interface. Bundled rather than fetched at runtime: the app is built to keep
  # working when the shop's connection is down, and a logo that renders in a
  # fallback face on exactly those days is a logo that fails when it is noticed.
  #
  # Caveat is SIL Open Font License 1.1 -- see assets/fonts/Caveat-OFL.txt,
  # which ships alongside it because the licence requires the notice to travel
  # with the font.
  fonts:
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Bold.ttf
          weight: 700

  assets:
    - assets/fonts/Caveat-OFL.txt
