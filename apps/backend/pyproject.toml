[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tally-backend"
version = "0.1.0"
description = "FastAPI backend: auth, connector hub, dashboards and reports."
requires-python = ">=3.11"
dependencies = [
    "tally-core",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7,<3",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "redis>=5.0",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
tally-backend = "tally_backend.main:run"

[tool.setuptools.packages.find]
where = ["src"]

# The portal's single page is data, not a module, so nothing would pull it into
# a wheel by default -- and its absence only shows up as a 500 on /portal in a
# built image, never in an editable install.
[tool.setuptools.package-data]
tally_backend = ["portal/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning:passlib.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Alembic generates these files; reformatting them creates noisy diffs and makes
# a hand-edited migration harder to spot in review.
"migrations/**" = ["E501", "I001", "UP035", "F401"]
