<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Not a public page and never should be indexed: it lists customer
         businesses by name. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>TallyFlow Partner Desk</title>
    <!-- %BASE_URL% is substituted by vite with whatever `base` was built with,
         so this follows the deployment instead of hardcoding one of them. It
         was literally "/portal/favicon.svg", which 404s the moment the portal
         is served from its own hostname at the root. -->
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <!-- The app's face. Loaded rather than left to the system stack, so the
         portal and the phone beside it set the same numbers the same way. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <!-- Before first paint, so a Dim or Dark choice does not flash Light. -->
    <script>
      try {
        var t = localStorage.getItem('tallyflow.portal.theme');
        if (t === 'dim' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
